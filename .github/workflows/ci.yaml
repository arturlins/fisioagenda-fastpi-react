name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Ambiente de CI
        working-directory: .
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          sed -i 's/^BANCO_SENHA=.*/BANCO_SENHA=troque-este-valor/' backend/.env
          sed -i 's/^KEYCLOAK_CLIENT_SECRET=.*/KEYCLOAK_CLIENT_SECRET=troque-este-valor/' backend/.env
      - name: Postgres
        working-directory: .
        run: docker compose up -d --wait postgres
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy app servidor.py tests alembic/env.py
      # A suíte `keycloak` exige o IdP real; aqui ele é dublê.
      - run: uv run pytest -m "not keycloak"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact

  imagens:
    needs: [backend, frontend, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: fisioagenda-api
            contexto: backend
          - nome: fisioagenda-web
            contexto: frontend
          - nome: fisioagenda-keycloak
            contexto: keycloak
    env:
      IMAGEM: ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build para inspeção
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          load: true
          tags: ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
          provenance: false
          sbom: false
      - name: Vulnerabilidades críticas com correção disponível bloqueiam
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGEM }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar com SBOM e provenance
        if: env.PUBLICAR == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ env.IMAGEM }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          provenance: mode=max
          sbom: true
